name: Deploy query server

on:
  workflow_dispatch:

concurrency:
  group: cloud-run-query-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast3
      SERVICE: vlrgg-query
      VALIDATION_SERVICE: vlrgg-query-check
      REGISTRY_REPOSITORY: vlrgg-server
      RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - name: Require enabled deployment and successful CI for this main commit
        env:
          DEPLOY_ENABLED: ${{ vars.CLOUD_RUN_DEPLOY_ENABLED }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$DEPLOY_ENABLED" = true || { echo "::error::Deployment is disabled."; exit 1; }
          for variable in PROJECT_ID WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT RUNTIME_SERVICE_ACCOUNT; do
            test -n "${!variable}" || { echo "::error::Missing $variable."; exit 1; }
          done
          test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA&per_page=1" \
            | jq --exit-status --arg sha "$GITHUB_SHA" \
              '.workflow_runs[0] | .head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success"'

      - name: Check out the verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the existing server image before requesting cloud credentials
        shell: bash
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPOSITORY/query:$GITHUB_SHA"
          docker build --tag "$image" .
          echo "IMAGE_TAG=$image" >> "$GITHUB_ENV"

      - name: Authenticate deployment through Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push the image and resolve its immutable digest
        id: image
        shell: bash
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE_TAG"
          image="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          [[ "$image" == "$REGION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPOSITORY/query@sha256:"* ]]
          echo "digest=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy and inspect the private validation service
        id: validation
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          require_private_service() {
            local service_json="$1" policy
            jq --exit-status \
              '(.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false") != "true"' \
              <<< "$service_json" > /dev/null
            policy="$(gcloud run services get-iam-policy "$VALIDATION_SERVICE" \
              --project "$PROJECT_ID" --region "$REGION" --format=json)"
            jq --exit-status '
              [.bindings[]? |
                select(.role == "roles/run.invoker") |
                .members[]? |
                select(. == "allUsers" or . == "allAuthenticatedUsers")] |
              length == 0
            ' <<< "$policy" > /dev/null
          }

          services="$(gcloud run services list --project "$PROJECT_ID" --region "$REGION" \
            --filter "metadata.name=$VALIDATION_SERVICE" --format=json)"
          jq --exit-status --arg name "$VALIDATION_SERVICE" \
            'length <= 1 and all(.[]; .metadata.name == $name)' <<< "$services" > /dev/null
          if test "$(jq 'length' <<< "$services")" = 1; then
            existing="$(gcloud run services describe "$VALIDATION_SERVICE" \
              --project "$PROJECT_ID" --region "$REGION" --format=json)"
            jq --exit-status --arg name "$VALIDATION_SERVICE" '.metadata.name == $name' \
              <<< "$existing" > /dev/null
            require_private_service "$existing"
          fi

          gcloud run deploy "$VALIDATION_SERVICE" --quiet --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE_DIGEST" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --port=8080 --cpu=1 --memory=768Mi --concurrency=32 --timeout=30s \
            --min=0 --max=1 --min-instances=0 --max-instances=1 --cpu-throttling \
            --update-env-vars=VLRGG_ENABLE_API_DOCUMENTATION=false \
            > "$RUNNER_TEMP/cloud-run-validation-deploy.log" 2>&1
          service="$(gcloud run services describe "$VALIDATION_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq --exit-status --arg name "$VALIDATION_SERVICE" --arg image "$IMAGE_DIGEST" \
            --arg revision "$VALIDATION_SERVICE-r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '
            .metadata.name == $name and
            .spec.template.spec.containers[0].image == $image and
            .status.latestReadyRevisionName == $revision and
            (.status.url | type == "string" and length > 0)
          ' <<< "$service" > /dev/null
          require_private_service "$service"
          revision="$(jq --exit-status --raw-output '.status.latestReadyRevisionName' <<< "$service")"
          gcloud run services update-traffic "$VALIDATION_SERVICE" --quiet \
            --project "$PROJECT_ID" --region "$REGION" --to-revisions "$revision=100" \
            > "$RUNNER_TEMP/cloud-run-validation-traffic.log" 2>&1
          service="$(gcloud run services describe "$VALIDATION_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq --exit-status --arg name "$VALIDATION_SERVICE" --arg image "$IMAGE_DIGEST" \
            --arg revision "$revision" '
            .metadata.name == $name and
            .spec.template.spec.containers[0].image == $image and
            .status.latestReadyRevisionName == $revision and
            (.status.url | type == "string" and length > 0) and
            ([.status.traffic[]? | select((.percent // 0) > 0)] |
              length == 1 and .[0].percent == 100 and .[0].revisionName == $revision)
          ' <<< "$service" > /dev/null
          require_private_service "$service"
          url="$(jq --exit-status --raw-output '.status.url' <<< "$service")"
          test -n "$url"
          echo "::add-mask::$url"
          echo "::add-mask::${url#https://}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Obtain an ID token for the validation service
        id: validation-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.validation.outputs.url }}

      - name: Verify the private validation service
        env:
          SMOKE_URL: ${{ steps.validation.outputs.url }}
          SMOKE_ID_TOKEN: ${{ steps.validation-auth.outputs.id_token }}
          EXPECT_PRIVATE: "true"
        run: bash .github/scripts/smoke-query-server.sh

      - name: Deploy the verified image to production
        id: production
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          require_private_service() {
            local service_json="$1" policy
            jq --exit-status \
              '(.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false") != "true"' \
              <<< "$service_json" > /dev/null
            policy="$(gcloud run services get-iam-policy "$SERVICE" \
              --project "$PROJECT_ID" --region "$REGION" --format=json)"
            jq --exit-status '
              [.bindings[]? |
                select(.role == "roles/run.invoker") |
                .members[]? |
                select(. == "allUsers" or . == "allAuthenticatedUsers")] |
              length == 0
            ' <<< "$policy" > /dev/null
          }

          services="$(gcloud run services list --project "$PROJECT_ID" --region "$REGION" \
            --filter "metadata.name=$SERVICE" --format=json)"
          jq --exit-status --arg name "$SERVICE" \
            'length <= 1 and all(.[]; .metadata.name == $name)' <<< "$services" > /dev/null
          previous="$(jq --exit-status --raw-output '
            (.[0].status.traffic // []) | map(select((.percent // 0) > 0)) |
            if length == 0 then ""
            elif length == 1 and .[0].percent == 100 and
              (.[0].revisionName | type == "string" and length > 0)
            then .[0].revisionName else error("Expected one serving revision at 100% traffic") end
          ' <<< "$services")"
          flags=()
          first_deployment=false
          if test -z "$previous"; then
            if test "$(jq 'length' <<< "$services")" = 1; then
              existing="$(gcloud run services describe "$SERVICE" \
                --project "$PROJECT_ID" --region "$REGION" --format=json)"
              jq --exit-status --arg name "$SERVICE" '
                .metadata.name == $name and
                (.status.latestReadyRevisionName // "") == "" and
                ((.status.traffic // []) | map(select((.percent // 0) > 0)) | length == 0)
              ' <<< "$existing" > /dev/null
              require_private_service "$existing"
            fi
            first_deployment=true
            echo "first_deployment=true" >> "$GITHUB_OUTPUT"
          else
            echo "previous_revision=$previous" >> "$GITHUB_OUTPUT"
            flags=(--no-traffic)
          fi

          gcloud run deploy "$SERVICE" --quiet --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE_DIGEST" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --port=8080 --cpu=1 --memory=768Mi --concurrency=32 --timeout=30s \
            --min=1 --max=1 --min-instances=0 --max-instances=1 --cpu-throttling \
            --update-env-vars=VLRGG_ENABLE_API_DOCUMENTATION=false "${flags[@]}" \
            > "$RUNNER_TEMP/cloud-run-production-deploy.log" 2>&1
          service="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq --exit-status --arg name "$SERVICE" --arg image "$IMAGE_DIGEST" \
            --arg revision "$SERVICE-r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '
            .metadata.name == $name and
            .spec.template.spec.containers[0].image == $image and
            .status.latestReadyRevisionName == $revision and
            (.status.url | type == "string" and length > 0)
          ' <<< "$service" > /dev/null
          url="$(jq --exit-status --raw-output '.status.url' <<< "$service")"
          revision="$(jq --exit-status --raw-output '.status.latestReadyRevisionName' <<< "$service")"
          test -n "$url"
          test -n "$revision"
          if test "$first_deployment" = true; then
            require_private_service "$service"
            jq --exit-status --arg revision "$revision" '
              [.status.traffic[]? | select((.percent // 0) > 0)] |
              length == 1 and .[0].percent == 100 and .[0].revisionName == $revision
            ' <<< "$service" > /dev/null
          else
            jq --exit-status --arg revision "$revision" '
              [.status.traffic[]? |
                select(.revisionName == $revision and (.percent // 0) > 0)] | length == 0
            ' <<< "$service" > /dev/null
          fi
          echo "::add-mask::$url"
          echo "::add-mask::${url#https://}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Obtain an ID token for the production service
        id: production-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.production.outputs.url }}

      - name: Promote the verified revision
        id: promote
        if: steps.production.outputs.previous_revision != ''
        env:
          REVISION: ${{ steps.production.outputs.revision }}
        run: >-
          gcloud run services update-traffic "$SERVICE" --quiet
          --project "$PROJECT_ID" --region "$REGION" --to-revisions "$REVISION=100"
          > "$RUNNER_TEMP/cloud-run-promote.log" 2>&1

      - name: Verify the serving URL after promotion
        env:
          SMOKE_URL: ${{ steps.production.outputs.url }}
          SMOKE_ID_TOKEN: ${{ steps.production-auth.outputs.id_token }}
          EXPECT_PRIVATE: ${{ steps.production.outputs.first_deployment }}
        run: bash .github/scripts/smoke-query-server.sh

      - name: Restore previous traffic if promotion or serving checks fail
        if: failure() && steps.production.outputs.previous_revision != '' && steps.promote.outcome != 'skipped'
        env:
          PREVIOUS_REVISION: ${{ steps.production.outputs.previous_revision }}
        run: >-
          gcloud run services update-traffic "$SERVICE" --quiet
          --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PREVIOUS_REVISION=100"
          > "$RUNNER_TEMP/cloud-run-rollback.log" 2>&1

      - name: Remove warm capacity after a failed first deployment
        if: failure() && steps.production.outputs.first_deployment == 'true'
        run: >-
          gcloud run services update "$SERVICE" --quiet
          --project "$PROJECT_ID" --region "$REGION" --min=0
          > "$RUNNER_TEMP/cloud-run-scale-down.log" 2>&1

      - name: Show sanitized Cloud Run diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for log in "$RUNNER_TEMP"/cloud-run-*.log; do
            test -f "$log" || continue
            echo "${log##*/}"
            sed -E \
              -e 's#https?://[^[:space:]"<>]+#***#g' \
              -e 's#(https?://)?[[:alnum:].-]+\.run\.app#***#g' \
              -e 's#[[:alnum:]-]+-docker\.pkg\.dev/[^[:space:]"<>]+#***#g' \
              "$log" | tail -n 80
          done

      - name: Record the deployed release
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo "Query deployment and smoke checks passed."
            echo "A first deployment remains private. Public access and cost-stop verification are separate operator steps."
          } >> "$GITHUB_STEP_SUMMARY"
