name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Platform to validate for deployment
        required: true
        default: all
        type: choice
        options: [all, android, server, ios]
      source_sha:
        description: Exact current main SHA (reject if main moved)
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.select.outputs.android }}
      server: ${{ steps.select.outputs.server }}
      ios: ${{ steps.select.outputs.ios }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version

      - name: Check CI selection and deployment proof contracts
        run: ruby scripts/ci/ci_contract_test.rb

      - name: Select affected platforms
        id: select
        run: ruby scripts/ci/ci_contract.rb detect

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    concurrency:
      group: ci-deploy-${{ github.ref }}-android
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Ruby and fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check app release process contracts
        run: |
          test "$(ruby -e 'print RUBY_VERSION')" = 3.3.7
          bundle exec ruby -e 'abort unless Gem.loaded_specs.fetch("fastlane").version.to_s == "2.239.0"'
          ruby scripts/app-release/release_contract_test.rb
          bundle exec ruby -c fastlane/Fastfile
          bundle exec ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/deploy-app-*.yml
          bundle exec fastlane lanes

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run credential-free KMP and Android checks
        run: >
          ./gradlew --no-daemon
          :app:shared:testAndroidHostTest
          :app:androidApp:testDebugUnitTest
          :app:androidApp:lintDebug

      - name: Check Android release input boundaries
        run: sh app/androidApp/scripts/test-release-config.sh

      - name: Check ephemeral Firebase configuration and Android collection policy
        run: |
          python3 -B scripts/firebase/test_with_config.py
          sh app/androidApp/scripts/test-crashlytics-config.sh

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    concurrency:
      group: ci-deploy-${{ github.ref }}-server
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check production deployment retry and traffic guards
        run: |
          bash .github/scripts/test-query-production-deploy.sh
          bash .github/scripts/test-observability-operations.sh
          python3 -B .github/scripts/test-observability-runtime-proof.py

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run server tests and build distributions
        run: >
          ./gradlew --no-daemon
          :server:test
          :server:build
          :server:installDist
          :server:observabilityValidationJar

      - name: Smoke packaged health, fault isolation, and structured failure stdout
        shell: bash
        run: bash .github/scripts/smoke-observability.sh

      - name: Verify rebuilt validation image applicability without starting a container
        shell: bash
        run: bash .github/scripts/test-observability-runtime-container.sh

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    concurrency:
      group: ci-deploy-${{ github.ref }}-ios
      cancel-in-progress: false
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Require pinned Xcode
        run: test "$(xcodebuild -version)" = "$(printf 'Xcode 26.6\nBuild version 17F113')"

      - name: Check iOS release input boundaries
        run: |
          sh app/iosApp/Scripts/test_release_config.sh
          sh app/iosApp/Scripts/test_firebase_crashlytics.sh

      - name: Run iOS simulator tests and compilation checks
        run: >
          ./gradlew --no-daemon
          :app:shared:iosSimulatorArm64Test
          :app:shared:compileKotlinIosSimulatorArm64

      - name: Build unsigned Release simulator app
        env:
          API_BASE_URL: https://example.invalid
          APP_VERSION: 1.2.3
          APP_BUILD_NUMBER: '42'
          FIREBASE_ALLOW_UNCONFIGURED: 'YES'
        run: |
          temp_dir=$(mktemp -d "$RUNNER_TEMP/vlrgg-ios-check.XXXXXX")
          trap 'rm -rf "$temp_dir"' EXIT
          xcrun swift app/iosApp/Scripts/release_config.swift generate "$temp_dir/Release.xcconfig"
          xcodebuild -project app/iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$temp_dir/DerivedData" -xcconfig "$temp_dir/Release.xcconfig" \
            CODE_SIGNING_ALLOWED=NO build

  # Keep this stable check name for branch protection; skipped platforms are checked explicitly.
  verify:
    if: always()
    needs: [changes, android, server, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require every selected platform to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: ruby scripts/ci/ci_contract.rb gate

      - name: Check event patch formatting
        run: ruby scripts/ci/ci_contract.rb whitespace
