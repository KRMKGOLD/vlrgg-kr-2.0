name: Deploy iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      APP_VERSION:
        description: Marketing version (for example 1.2.3)
        required: true
        type: string
      APP_BUILD_NUMBER:
        description: New positive build number
        required: true
        type: string

concurrency:
  group: deploy-app-ios-testflight
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.freeze.outputs.source_sha }}
    steps:
      - name: Freeze main source
        id: freeze
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$SOURCE_REF" = refs/heads/main
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out frozen source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.freeze.outputs.source_sha }}
          persist-credentials: false

      - name: Set up pinned Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version

      - name: Validate release inputs
        env:
          APP_VERSION: ${{ inputs.APP_VERSION }}
          APP_BUILD_NUMBER: ${{ inputs.APP_BUILD_NUMBER }}
          SOURCE_SHA: ${{ steps.freeze.outputs.source_sha }}
        run: ruby scripts/app-release/release_contract.rb validate-inputs

      - name: Require successful CI for frozen main source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.freeze.outputs.source_sha }}
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$SOURCE_SHA" -f status=success -f per_page=100 \
            | ruby scripts/app-release/release_contract.rb verify-ci "$SOURCE_SHA"

  deploy:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP_VERSION: ${{ inputs.APP_VERSION }}
      APP_BUILD_NUMBER: ${{ inputs.APP_BUILD_NUMBER }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
      IOS_TESTFLIGHT_DEPLOY_ENABLED: ${{ vars.IOS_TESTFLIGHT_DEPLOY_ENABLED }}
    steps:
      - name: Keep deployment disabled until the environment is configured
        run: test "$IOS_TESTFLIGHT_DEPLOY_ENABLED" = true

      - name: Configure temporary paths
        run: |
          echo "IOS_KEYCHAIN_MARKER_PATH=$RUNNER_TEMP/vlrgg-keychain-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_MARKER_PATH=$RUNNER_TEMP/vlrgg-profile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out frozen source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Require pinned Xcode
        run: test "$(xcodebuild -version)" = "$(printf 'Xcode 26.6\nBuild version 17F113')"

      - name: Set up pinned Ruby and fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios internal

      - name: Remove signing and binary files
        if: always()
        run: ruby scripts/app-release/release_contract.rb cleanup-ios
